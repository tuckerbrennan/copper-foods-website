name: Verify Copper staging identity
on:
  push:
    branches: [requirements-staging]
    paths: [.github/workflows/verify-staging-identity.yml]
permissions:
  id-token: write
  statuses: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Record repository branch identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          subject=$(python3 - <<'PY'
          import base64, json, os, urllib.request
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']
          })
          with urllib.request.urlopen(request, timeout=15) as response:
              payload = json.load(response)['value'].split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          assert claims['aud'] == 'sts.amazonaws.com'
          assert claims['repository'] == 'tuckerbrennan/copper-foods-website'
          assert claims['ref'] == 'refs/heads/requirements-staging'
          print(claims['sub'])
          PY
          )
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context=copper/staging-identity -f description="$subject" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
          printf 'OIDC subject %s\n' "$subject"
