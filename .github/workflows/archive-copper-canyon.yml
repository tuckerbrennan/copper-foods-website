name: Archive Copper Canyon public website images

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/archive-copper-canyon.yml'
      - 'scripts/archive_copper_canyon_assets.py'

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out crawler
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install crawler dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Download public website media at original resolution
        run: python scripts/archive_copper_canyon_assets.py

      - name: Package image files and provenance manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copper-canyon-original-website-images
          path: copper-canyon-site-archive/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
